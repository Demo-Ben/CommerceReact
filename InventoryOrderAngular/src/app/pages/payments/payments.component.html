<h2>Payments</h2>

<table border="1" cellpadding="4">
    <thead>
        <tr>
            <th>Id</th>
            <th>Order Id</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Paid On</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let p of payments">
            <td>{{ p.id }}</td>
            <td>{{ p.orderId }}</td>
            <td>{{ formatAmount(p.amount) }}</td>
            <td>{{ p.status }}</td>
            <td>{{ formatDate(p.paidAt) }}</td>
            <td>
                <button *ngIf="p.status !== 'Completed'" (click)="payAgain(p.id, p.amount)">
                    Pay Again
                </button>
            </td>
        </tr>
    </tbody>
</table>
