
<h2 style="margin-top:24px;">Available Inventory</h2>

<table border="1" cellpadding="4">
    <thead>
        <tr>
            <th>Inventory ID</th>
            <th>Name</th>
            <th>Stock</th>
            <th>Price</th>
            <th>Create Order</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let item of inventory">
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.stock }}</td>
            <td>${{ item.price }}</td>
            <td>
                <button (click)="createOrder(item.id, 1)" [disabled]="item.stock <= 0">Create Order</button>
            </td>
        </tr>
    </tbody>
</table>



<h2>Existing Orders</h2>

<table border="1" cellpadding="4">
    <thead>
        <tr>
            <th>Order Id</th>
            <th>Inventory ID</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let order of orders">
            <td>{{ order.id }}</td>
            <td>{{ order.itemId }}</td>
            <td>{{ order.quantity }}</td>
            <td>${{ order.total }}</td>
            <td>{{ order.status }}</td>
            <td>
                <button *ngIf="order.status !== 'Paid'" (click)="payOrder(order.id, order.total)">
                    Pay
                </button>
                <button *ngIf="order.status !== 'Paid'" (click)="deleteOrder(order.id)">
                    Delete
                </button>
            </td>
        </tr>
    </tbody>
</table>
